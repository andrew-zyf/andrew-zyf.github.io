const search=document.querySelector('#search');
const region=document.querySelector('#region-filter');
const country=document.querySelector('#country-filter');
const coverage=document.querySelector('#coverage-filter');
const topic=document.querySelector('#topic-filter');
const subcategory=document.querySelector('#subcategory-filter');
const format=document.querySelector('#format-filter');
const entries=[...document.querySelectorAll('.publication')].map(element=>({element,topics:JSON.parse(element.dataset.topics),formats:element.dataset.formats.split('|')}));
const formatOrder=['新闻媒体','杂志期刊','研究机构','博客专栏','邮件订阅','社区论坛','视频频道','产品工具','聚合导航'];
const nameCollator=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});
for(const entry of entries){
  entry.name=entry.element.querySelector('h2').textContent.trim();
  entry.names=[entry.name,entry.element.querySelector('.translation')?.textContent.trim()||''].map(name=>name.toLowerCase());
  entry.primaryTopic=Object.keys(entry.topics)[0];
  entry.formatRank=Math.min(...entry.formats.map(value=>{const index=formatOrder.indexOf(value);return index<0?formatOrder.length:index;}));
}
function searchRelevance(entry,query,words){
  if(!query)return 0;
  if(entry.names.some(name=>name===query))return 4;
  if(entry.names.some(name=>name.startsWith(query)))return 3;
  if(entry.names.some(name=>name.includes(query)))return 2;
  return words.filter(word=>entry.names.some(name=>name.includes(word))).length/words.length;
}
function sortEntries(query,words){
  const sorted=[...entries].sort((a,b)=>{
    const relevance=searchRelevance(b,query,words)-searchRelevance(a,query,words);
    if(relevance)return relevance;
    // A site's main field takes precedence over a secondary topic when a field is selected.
    if(topic.value!=='全部'){
      const primary=Number(b.primaryTopic===topic.value)-Number(a.primaryTopic===topic.value);
      if(primary)return primary;
    }
    return a.formatRank-b.formatRank
      ||Number(a.element.dataset.country==='待核实')-Number(b.element.dataset.country==='待核实')
      ||nameCollator.compare(a.element.dataset.country,b.element.dataset.country)
      ||nameCollator.compare(a.name,b.name)
      ||a.element.href.localeCompare(b.element.href);
  });
  const fragment=document.createDocumentFragment();
  for(const entry of sorted)fragment.append(entry.element);
  document.querySelector('.grid').append(fragment);
}
function updateCountries(){
  const previous=country.value;
  const values=[...new Set(entries.filter(entry=>region.value==='全部'||entry.element.dataset.region===region.value).map(entry=>entry.element.dataset.country))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  country.replaceChildren(new Option('全部','全部'),...values.map(value=>new Option(value,value)));
  country.value=values.includes(previous)?previous:'全部';
}
function updateSubcategories(){
  const previous=subcategory.value;
  const values=[...new Set(entries.flatMap(entry=>topic.value==='全部'?Object.values(entry.topics).flat():(entry.topics[topic.value]||[])))];
  subcategory.replaceChildren(new Option('全部','全部'),...values.map(value=>new Option(value,value)));
  subcategory.value=values.includes(previous)?previous:'全部';
}
function filter(){
  const query=search.value.trim().toLowerCase();
  const words=query.split(/\s+/).filter(Boolean);
  sortEntries(query,words);
  let count=0;
  for(const entry of entries){
    const subs=topic.value==='全部'?Object.values(entry.topics).flat():(entry.topics[topic.value]||[]);
    const visible=(region.value==='全部'||entry.element.dataset.region===region.value)
      &&(country.value==='全部'||entry.element.dataset.country===country.value)
      &&(coverage.value==='全部'||entry.element.dataset.scope===coverage.value)
      &&(topic.value==='全部'||Object.hasOwn(entry.topics,topic.value))
      &&(subcategory.value==='全部'||subs.includes(subcategory.value))
      &&(format.value==='全部'||entry.formats.includes(format.value))
      &&words.every(word=>entry.element.dataset.search.includes(word));
    entry.element.hidden=!visible;
    if(visible)count++;
  }
  const labels=[region.value==='全部'?'全部地区':region.value,topic.value==='全部'?'全部领域':topic.value];
  if(country.value!=='全部')labels.splice(1,0,country.value);
  if(coverage.value!=='全部')labels.push(coverage.value);
  if(subcategory.value!=='全部')labels.push(subcategory.value);
  if(format.value!=='全部')labels.push(format.value);
  document.querySelector('#count').textContent=labels.join(' · ')+' · '+count+' 个站点';
  document.querySelector('#empty').hidden=count!==0;
}
search.addEventListener('input',filter);
for(const select of [country,coverage,subcategory,format])select.addEventListener('change',filter);
region.addEventListener('change',()=>{country.value='全部';updateCountries();filter();});
topic.addEventListener('change',()=>{subcategory.value='全部';updateSubcategories();filter();});
document.querySelector('#reset-filters').addEventListener('click',()=>{
  search.value='';region.value='全部';country.value='全部';coverage.value='全部';topic.value='全部';subcategory.value='全部';format.value='全部';updateCountries();updateSubcategories();filter();
});
updateCountries();updateSubcategories();filter();
</script></body></html>
